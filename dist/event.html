<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <title>Page title</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/styles.min.css">
</head>

<body class="body">

  <header class="page-header">
    <div class="page-header__container">
      <a class="page-header__logo" href="index.html">
        <svg class="page-header__logo-icon" width="202px height=147">
          <use xlink:href="assets/icons/logo.svg">
        </svg>
      </a>

      <nav class="page-header__nav">
        <a class="page-header__nav-link" href="#">Мероприятия</a>
        <a class="page-header__nav-link" href="#">Блог</a>
        <a class="page-header__nav-link" href="#">О нас</a>
        <a class="page-header__nav-link" href="#">Контакты</a>
      </nav>

      <div class="page-header__right-block">
        <a class="page-header__btn btn" href="#">
          Войти
        </a>
      </div>
    </div>
  </header>

  <main class="main">

    <article class="event">

      <form class="reserve event__reserve">


        <div class="reserve__checks">
          <h4 class="reserve__section-title">
            Забронировать столик
          </h4>

          <div class="reserve__book">
            <label class="reserve__check check check--red">
              <input type="checkbox" name="table_1" class="check__input" />
              <span class="check__mark"></span>
              <span class="check__label">1 стол</span>
            </label>

            <label class="reserve__check check">
              <input type="checkbox" name="table_2" class="check__input" />
              <span class="check__mark"></span>
              <span class="check__label">2 стол</span>
            </label>

            <label class="reserve__check check check--disabled">
              <input type="checkbox" name="table_5" class="check__input" disabled />
              <span class="check__mark"></span>
              <span class="check__label">5 стол </span>
            </label>
          </div>
        </div>



        <div class="reserve__scheme">
          <div class="reserve__scheme-container">
            <h4 class="reserve__scheme-title">Сцена</h4>

            <div class="reserve__scheme-wrapper">
              <svg class="reserve__scene scene" width="780" height="399" viewBox="0 0 780 399" fill="none">
                <use xlink:href="assets/icons/scene.svg"></use>
              </svg>
            </div>
          </div>
        </div>

        <div class="reserve__order">
          <h4 class="reserve__section-title">Ваши пригласительные билеты</h4>

          <div class="reserve__tickets-list">
            <div class="reserve__tickets">
              <div class="reserve__qty" data-caption="шт." data-price="1400">9</div>
              <div class="reserve__sum" data-currency="₽">12600</div>
            </div>

            <div class="reserve__tickets">
              <div class="reserve__qty" data-caption="шт." data-price="1250">4</div>
              <div class="reserve__sum" data-currency="₽">5000</div>
            </div>
          </div>

          <div class="reserve__total" data-caption="Сумма" data-currency="₽">17600</div>
          <button type="submit" class="btn btn--red reserve__submit">
            Купить билеты
          </button>
        </div>

        <div class="reserve__legend">

          <h4 class="reserve__section-title">Стоимость пригласительного билета</h4>

          <div class="reserve__cost-list">
            <div class="reserve__cost">
              <div class="reserve__qty" data-caption="персона" data-price="1400 ₽">1</div>
              <div class="reserve__qty" data-caption="персона" data-price="1250 ₽">1</div>
            </div>
          </div>

          <h4 class="reserve__section-title">Примечание</h4>
          <div class="reserve__tickets-list">
            <div class="reserve__tickets">
              <div class="reserve__sum">доступные места</div>
            </div>

            <div class="reserve__tickets">
              <div class="reserve__sum">забронировано</div>
            </div>

          </div>

      </form>
    </article>

  </main>

  <footer class="page-footer">
    footer
  </footer>

</body>

</html>
